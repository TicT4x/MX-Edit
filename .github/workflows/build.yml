# Builds MX-Edit and the MX5 Bridge patcher for macOS (Apple Silicon + Intel) and Linux with
# PyInstaller and attaches them to a release when it is published. The Windows .exe files are
# built locally (veroeffentlichen.py) and uploaded with the release.
# Run it by hand (Actions > Build macOS and Linux > Run workflow) to get the files as artifacts.
name: Build macOS and Linux

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14          # Apple Silicon
            tag: macOS-AppleSilicon
          - os: macos-15-intel    # Intel Macs
            tag: macOS-Intel
          - os: ubuntu-22.04      # glibc 2.35: Ubuntu 22.04+, Debian 12+, Fedora 36+ and newer
            tag: Linux-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build tools
        run: python -m pip install "pyinstaller==6.*" pillow mido python-rtmidi

      - name: Build MX-Edit
        run: python editor/werkzeuge/exe_bauen.py

      - name: Build the patcher
        run: python firmware/tools/patcher_exe.py

      - name: Package
        shell: bash
        run: |
          EV=$(sed -n 's/^APP = U.APP_NAME + " \([0-9.]*\)".*/\1/p' editor/mx5editor.py)
          BV=$(sed -n "s/^VERSION = '\([0-9.]*\)'.*/\1/p" firmware/bridgepatch.py)
          mkdir dist
          if [ "$RUNNER_OS" = macOS ]; then
            # ditto keeps the app bundle intact (symlinks, signature)
            ditto -c -k --keepParent editor/exe/MX-Edit.app "dist/MX-Edit_${EV}_${{ matrix.tag }}.zip"
            ditto -c -k --keepParent firmware/exe/MX5Bridge_Patcher.app "dist/MX5Bridge_${BV}_Patcher_${{ matrix.tag }}.zip"
          else
            # tar keeps the executable bit
            tar -czf "dist/MX-Edit_${EV}_${{ matrix.tag }}.tar.gz" -C editor/exe MX-Edit
            tar -czf "dist/MX5Bridge_${BV}_Patcher_${{ matrix.tag }}.tar.gz" -C firmware/exe MX5Bridge_Patcher
          fi
          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.tag }}
          path: dist/*

      - name: Attach to the release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" dist/* --clobber
